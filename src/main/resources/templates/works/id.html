<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Work</title>
    <link rel="stylesheet" th:href="@{/css/pico.min.css}">
    <link rel="stylesheet" th:href="@{/css/prism.css}">
</head>
<body>
<h1 th:text="${work.originalFileName}"></h1>
<a th:href="@{/download(fileName=${work.storedFileName})}" th:text="${work.storedFileName}"></a>
<p th:text="${work.uploadTime}"></p>
<a th:href="@{/workspaces/{workspaceId}(workspaceId=${work.workspaceId})}">workspace로 가기</a>

<div>
    <button
        th:hx-get="@{/works/{id}/preview(id=${work.id})}"
        hx-target="#file-preview"
        hx-swap="innerHTML"
    >
        미리보기
    </button>
    <div id="file-preview"></div>
</div>

<script th:src="@{/js/prism.js}"></script>
<script th:src="@{/js/htmx.min.js}"></script>

</body>
</html>

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.csv'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// csv parser
	implementation 'com.univocity:univocity-parsers:2.9.1'

	// csv import library
	implementation 'com.github.js990311:csvloader:0.1.2'
}

tasks.named('test') {
	useJUnitPlatform()
}

task loadCsv(type: JavaExec) {
	group = "application"
	description = "Run the CsvLoad application as a CLI (no web server)."

	mainClass = "com.csv.importer.ImporterApplication"

	// CP 설정
	classpath = sourceSets.main.runtimeClasspath

	args "test.yml", "test.csv"
	args "--spring.main.web-application-type=NONE"
}
